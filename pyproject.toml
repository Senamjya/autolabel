[project]
name = "autolabel"
dynamic = ["version"]
description = "An offline batch tool that detects and measures Nile red fluorescence microplastic particles on filter-paper photographs."
authors = [{ name = "Senam Julian Yao Asmussen" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.scripts]
autolabel = "autolabel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/autolabel/provenance.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autolabel"]

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "pytest>=8.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.ty.environment]
root = ["src", "tests"]
